name: oficina-system

x-local-aws: &local-aws
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  SQS_ENDPOINT: http://elasticmq:9324
  SAGA_REPLIES_QUEUE: oficina-saga-replies
  BILLING_COMMANDS_QUEUE: oficina-billing-commands
  EXECUTION_COMMANDS_QUEUE: oficina-execution-commands
  JWT_SECRET: ${JWT_SECRET:-local-development-secret}
  APP_ENV: local

services:
  os-service:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      <<: *local-aws
      OTEL_SERVICE_NAME: oficina-os-service
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-local-internal-secret}
      DATABASE_URL: postgres://postgres:postgres@os-postgres:5432/oficina_mecanica?sslmode=disable
      SAGA_STEP_TIMEOUT: ${SAGA_STEP_TIMEOUT:-72h}
    depends_on:
      os-postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started

  billing-service:
    build: ../oficina-billing-service
    ports:
      - "8081:8080"
    restart: unless-stopped
    environment:
      <<: *local-aws
      OTEL_SERVICE_NAME: oficina-billing-service
      DATABASE_URL: postgres://postgres:postgres@billing-postgres:5432/oficina_billing?sslmode=disable
      PAYMENT_GATEWAY: fake
      PUBLIC_BASE_URL: http://localhost:8081
    depends_on:
      billing-postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started

  execution-service:
    build: ../oficina-execution-service
    ports:
      - "8082:8080"
    restart: unless-stopped
    environment:
      <<: *local-aws
      OTEL_SERVICE_NAME: oficina-execution-service
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE_PREFIX: oficina-execution
      DYNAMODB_CREATE_TABLES: "true"
    depends_on:
      dynamodb:
        condition: service_started
      elasticmq:
        condition: service_started

  os-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina_mecanica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  billing-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina_billing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./local/elasticmq.conf:/opt/elasticmq.conf:ro
