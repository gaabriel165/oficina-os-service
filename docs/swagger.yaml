basePath: /api/v1
definitions:
  dto.CancelServiceOrderRequest:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  dto.ChangeCustomerStatusRequest:
    properties:
      status:
        example: inactive
        type: string
    required:
    - status
    type: object
  dto.CreateCustomerRequest:
    properties:
      document:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - document
    - email
    - name
    - phone
    type: object
  dto.CreateServiceOrderRequest:
    properties:
      customer_id:
        type: string
      notes:
        type: string
      vehicle_id:
        type: string
    required:
    - customer_id
    - vehicle_id
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.CreateVehicleRequest:
    properties:
      brand:
        type: string
      customer_id:
        type: string
      model:
        type: string
      plate:
        type: string
      year:
        type: integer
    required:
    - brand
    - customer_id
    - model
    - plate
    - year
    type: object
  dto.CustomerIdentityResponse:
    properties:
      id:
        type: string
      name:
        type: string
      status:
        type: string
    type: object
  dto.CustomerResponse:
    properties:
      created_at:
        type: string
      document:
        type: string
      document_type:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.SagaLogEntryResponse:
    properties:
      detail:
        type: string
      kind:
        type: string
      name:
        type: string
      occurred_at:
        type: string
    type: object
  dto.SagaResponse:
    properties:
      deadline:
        type: string
      failure_reason:
        type: string
      finished_at:
        type: string
      id:
        type: string
      log:
        items:
          $ref: '#/definitions/dto.SagaLogEntryResponse'
        type: array
      order_id:
        type: string
      pending_compensations:
        items:
          type: string
        type: array
      started_at:
        type: string
      status:
        type: string
      step:
        type: string
    type: object
  dto.ServiceOrderResponse:
    properties:
      budget_id:
        type: string
      cancellation_reason:
        type: string
      checkout_url:
        type: string
      created_at:
        type: string
      customer_id:
        type: string
      finished_at:
        type: string
      id:
        type: string
      notes:
        type: string
      payment_id:
        type: string
      started_at:
        type: string
      status:
        $ref: '#/definitions/valueobject.OrderStatus'
      total_amount:
        type: number
      updated_at:
        type: string
      vehicle_id:
        type: string
    type: object
  dto.ServiceOrderStatusResponse:
    properties:
      id:
        type: string
      status:
        $ref: '#/definitions/valueobject.OrderStatus'
      total_amount:
        type: number
      updated_at:
        type: string
    type: object
  dto.StatusChangeResponse:
    properties:
      from:
        $ref: '#/definitions/valueobject.OrderStatus'
      occurred_at:
        type: string
      reason:
        type: string
      to:
        $ref: '#/definitions/valueobject.OrderStatus'
    type: object
  dto.TokenResponse:
    properties:
      token:
        type: string
    type: object
  dto.UpdateCustomerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - email
    - name
    - phone
    type: object
  dto.UpdateVehicleRequest:
    properties:
      brand:
        type: string
      model:
        type: string
      year:
        type: integer
    required:
    - brand
    - model
    - year
    type: object
  dto.VehicleResponse:
    properties:
      brand:
        type: string
      created_at:
        type: string
      customer_id:
        type: string
      id:
        type: string
      model:
        type: string
      plate:
        type: string
      updated_at:
        type: string
      year:
        type: integer
    type: object
  response.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  valueobject.OrderStatus:
    enum:
    - received
    - in_diagnosis
    - waiting_approval
    - waiting_payment
    - in_execution
    - finished
    - delivered
    - cancelled
    type: string
    x-enum-varnames:
    - OrderStatusReceived
    - OrderStatusInDiagnosis
    - OrderStatusWaitingApproval
    - OrderStatusWaitingPayment
    - OrderStatusInExecution
    - OrderStatusFinished
    - OrderStatusDelivered
    - OrderStatusCancelled
host: localhost:8080
info:
  contact: {}
  description: 'API for managing a mechanical workshop: service orders, customers,
    vehicles, parts and services.'
  title: Tech Challenge — Oficina Mecânica API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Authenticate user and get JWT token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: User credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /customers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CustomerResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List all customers
      tags:
      - customers
    post:
      consumes:
      - application/json
      parameters:
      - description: Customer data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCustomerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CustomerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new customer
      tags:
      - customers
  /customers/{id}:
    delete:
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a customer
      tags:
      - customers
    get:
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CustomerResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a customer by ID
      tags:
      - customers
    put:
      consumes:
      - application/json
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: string
      - description: Customer data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCustomerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CustomerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a customer
      tags:
      - customers
  /customers/{id}/status:
    patch:
      consumes:
      - application/json
      description: Inactive customers cannot authenticate by CPF through the API Gateway.
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: string
      - description: 'New status: active or inactive'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ChangeCustomerStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CustomerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Activate or deactivate a customer
      tags:
      - customers
  /internal/customers/by-document/{document}:
    get:
      description: Used by the authentication Lambda instead of reading the customers
        table. Requires the X-Internal-Secret header and is not routed by the API
        Gateway.
      parameters:
      - description: CPF or CNPJ, digits only or formatted
        in: path
        name: document
        required: true
        type: string
      - description: Shared service secret
        in: header
        name: X-Internal-Secret
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CustomerIdentityResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Find a customer by CPF or CNPJ (service-to-service)
      tags:
      - internal
  /service-orders:
    get:
      description: Operators see every active order sorted by urgency; customers authenticated
        by CPF see only their own.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ServiceOrderResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List active service orders
      tags:
      - service-orders
    post:
      consumes:
      - application/json
      description: The order is created as received and the diagnosis is requested
        from the Execution Service. Services and parts are added by the mechanic during
        diagnosis.
      parameters:
      - description: Service order data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateServiceOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ServiceOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Open a service order and start its saga
      tags:
      - service-orders
  /service-orders/{id}:
    get:
      description: Operators can read any order; customers authenticated by CPF can
        only read their own.
      parameters:
      - description: Service Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ServiceOrderResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a service order by ID
      tags:
      - service-orders
  /service-orders/{id}/cancel:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Service Order ID
        in: path
        name: id
        required: true
        type: string
      - description: Cancellation reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CancelServiceOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ServiceOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel a service order, compensating the steps already completed
      tags:
      - service-orders
  /service-orders/{id}/deliver:
    patch:
      parameters:
      - description: Service Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ServiceOrderResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deliver the vehicle to the customer
      tags:
      - service-orders
  /service-orders/{id}/history:
    get:
      parameters:
      - description: Service Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.StatusChangeResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the status history of a service order
      tags:
      - service-orders
  /service-orders/{id}/saga:
    get:
      parameters:
      - description: Service Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SagaResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 'Get the saga of a service order: current step, commands, replies and
        compensations'
      tags:
      - service-orders
  /service-orders/{id}/status:
    get:
      parameters:
      - description: Service Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ServiceOrderStatusResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get the current status of a service order (public)
      tags:
      - service-orders
  /vehicles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.VehicleResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List all vehicles
      tags:
      - vehicles
    post:
      consumes:
      - application/json
      parameters:
      - description: Vehicle data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateVehicleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.VehicleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new vehicle
      tags:
      - vehicles
  /vehicles/{id}:
    delete:
      parameters:
      - description: Vehicle ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a vehicle
      tags:
      - vehicles
    get:
      parameters:
      - description: Vehicle ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.VehicleResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a vehicle by ID
      tags:
      - vehicles
    put:
      consumes:
      - application/json
      parameters:
      - description: Vehicle ID
        in: path
        name: id
        required: true
        type: string
      - description: Vehicle data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateVehicleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.VehicleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a vehicle
      tags:
      - vehicles
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
