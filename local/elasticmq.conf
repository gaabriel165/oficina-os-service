include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  oficina-execution-commands {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "oficina-execution-commands-dlq"
      maxReceiveCount = 5
    }
  }
  oficina-execution-commands-dlq {}
  oficina-billing-commands {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "oficina-billing-commands-dlq"
      maxReceiveCount = 5
    }
  }
  oficina-billing-commands-dlq {}
  oficina-saga-replies {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "oficina-saga-replies-dlq"
      maxReceiveCount = 5
    }
  }
  oficina-saga-replies-dlq {}
}
